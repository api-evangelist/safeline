    resources:
    - path: /v1/api/userapi
      name: api-userapi
      description: REST surface for api-UserAPI.
      operations:
      - method: GET
        name: listusers
        description: List Users
        call: management-users.listusers
        with:
          page: rest.page
          page_size: rest.page_size
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuser
        description: Create User
        call: management-users.createuser
        with:
          body: rest.body
        outputParameters:
        - type: object
