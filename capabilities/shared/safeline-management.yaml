naftiko: "1.0.0-alpha1"

info:
  label: "SafeLine Management API"
  description: "SafeLine WAF management API for application protection, ACL rule management, SSL certificates, security policy configuration, and attack event analysis."
  tags:
    - WAF
    - Security
    - Web Application Firewall
    - Proxy
    - Open Source
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SAFELINE_API_TOKEN: SAFELINE_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: safeline
      baseUri: https://localhost:9443
      description: "SafeLine WAF management API"
      authentication:
        type: apikey
        key: X-SLCE-API-Token
        value: "{{SAFELINE_API_TOKEN}}"
        placement: header
      resources:
        - name: authentication
          path: /api/LoginAPI
          description: "User authentication and session management"
          operations:
            - name: login-user
              method: POST
              description: "Authenticate user with username and password"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  username: "{{tools.username}}"
                  password: "{{tools.password}}"

        - name: api-tokens
          path: /api/UserAPITokenAPI
          description: "API token management"
          operations:
            - name: list-api-tokens
              method: GET
              description: "List all API tokens for authenticated user"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-api-token
              method: POST
              description: "Create a new API token for programmatic access"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  comment: "{{tools.comment}}"

        - name: websites
          path: /api/SoftwareReverseProxyWebsiteAPI
          description: "Protected website management"
          operations:
            - name: list-websites
              method: GET
              description: "List all websites protected by SafeLine WAF"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: page_size
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-website
              method: POST
              description: "Add a new website to SafeLine WAF protection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  upstream: "{{tools.upstream}}"
                  ports: "{{tools.ports}}"

        - name: website-protection
          path: /api/EnableDisableWebsiteAPI
          description: "Website protection enable/disable"
          operations:
            - name: toggle-website-protection
              method: POST
              description: "Enable or disable WAF protection for a website"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  id: "{{tools.id}}"
                  enabled: "{{tools.enabled}}"

        - name: ssl-certificates
          path: /api/CertAPI
          description: "SSL/TLS certificate management"
          operations:
            - name: list-ssl-certificates
              method: GET
              description: "List all SSL certificates configured in SafeLine"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: acl-rules
          path: /api/ACLRuleAPI
          description: "Access control list rules"
          operations:
            - name: list-acl-rules
              method: GET
              description: "List ACL rules for blocking or allowing traffic"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: page_size
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-acl-rule
              method: POST
              description: "Create a new ACL rule for traffic filtering"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  action: "{{tools.action}}"
                  conditions: "{{tools.conditions}}"

        - name: acl-whitelist
          path: /api/ACLWhiteListAPI
          description: "ACL whitelist management"
          operations:
            - name: list-acl-whitelist
              method: GET
              description: "List IP addresses in the ACL whitelist"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: add-to-acl-whitelist
              method: POST
              description: "Add an IP address or CIDR block to the whitelist"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  ip: "{{tools.ip}}"
                  comment: "{{tools.comment}}"

        - name: policy-groups
          path: /api/PolicyGroupAPI
          description: "Security policy group management"
          operations:
            - name: list-policy-groups
              method: GET
              description: "List security policy groups"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-policy-group
              method: POST
              description: "Create a new security policy group"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  comment: "{{tools.comment}}"

        - name: reports
          path: /api/ReportResultAPI
          description: "Security report management"
          operations:
            - name: get-report-results
              method: GET
              description: "Get generated security reports"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: acl-logs
          path: /api/ACLRuleExecutionLogAPI
          description: "ACL rule execution logs"
          operations:
            - name: get-acl-execution-logs
              method: GET
              description: "Get logs of ACL rule executions and triggered actions"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: start_time
                  in: query
                  type: integer
                  required: false
                  description: "Unix timestamp start"
                - name: end_time
                  in: query
                  type: integer
                  required: false
                  description: "Unix timestamp end"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: node-info
          path: /api/NodeInfoAPI
          description: "System node information"
          operations:
            - name: get-node-info
              method: GET
              description: "Get system node information and hardware stats"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: safeline-rest
      resources:
        - path: /v1/websites
          name: websites
          operations:
            - method: GET
              name: list-websites
              description: "List protected websites"
              call: "safeline.list-websites"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/acl-rules
          name: acl-rules
          operations:
            - method: GET
              name: list-acl-rules
              description: "List ACL rules"
              call: "safeline.list-acl-rules"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: safeline-mcp
      transport: http
      tools:
        - name: list-websites
          description: "List all websites protected by SafeLine WAF"
          hints:
            readOnly: true
            openWorld: false
          call: "safeline.list-websites"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-acl-rules
          description: "List ACL traffic rules"
          hints:
            readOnly: true
            openWorld: false
          call: "safeline.list-acl-rules"
          outputParameters:
            - type: object
              mapping: "$."
