aid: safeline
name: SafeLine
description: >-
  SafeLine is an open-source self-hosted Web Application Firewall (WAF) and reverse proxy developed by Chaitin
  Technology that protects web applications and APIs from attacks including SQL injection, XSS, code injection, OS
  command injection, SSRF, path traversal, and RCE. With over 180,000 installations protecting more than 1 million
  websites, SafeLine handles over 30 billion HTTP requests daily. It provides rate limiting, anti-bot defenses, dynamic
  code protection, and integrates with API gateways including Apache APISIX and Kong. SafeLine exposes a management API
  on port 9443 and supports MCP server implementations for AI-assisted management.
